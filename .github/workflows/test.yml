name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    name: Lint

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'

      - name: Npm install
        run: npm ci

      - name: Composer install
        run: composer install

      - name: Running lint check
        run: npm run lint

  php-unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      matrix:
        php: ['8.2', '8.4', '8.5']
        wp: ['WordPress', 'WordPress#7.1.3']
        include:
          - wp: WordPress
            label: WP trunk
          - wp: WordPress#7.1.3
            label: WP 7.1.3

    name: PHP Unit / PHP ${{ matrix.php }} / ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'

      - name: Npm install
        run: npm ci

      - name: Composer install
        run: composer install

      - name: Install WordPress
        run: |
          WP_ENV_CORE=WordPress/${{ matrix.wp }} WP_ENV_PHP_VERSION=${{ matrix.php }} npm run wp-env-test start
          npm run wp-env-test run cli wp core version

      - name: Running PHP unit tests
        run: npm run test:php

  e2e-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          # Browser differences only depend on the WordPress version,
          # so all browsers run on the latest PHP only.
          - php: '8.2'
            wp: WordPress
            label: WP trunk
            browsers: chromium
          - php: '8.2'
            wp: WordPress#7.1.3
            label: WP 7.1.3
            browsers: chromium

          - php: '8.4'
            wp: WordPress
            label: WP trunk
            browsers: chromium
          - php: '8.4'
            wp: WordPress#7.1.3
            label: WP 7.1.3
            browsers: chromium

          - php: '8.5'
            wp: WordPress
            label: WP trunk
            browsers: chromium firefox webkit
          - php: '8.5'
            wp: WordPress#7.1.3
            label: WP 7.1.3
            browsers: chromium firefox webkit

    name: E2E / PHP ${{ matrix.php }} / ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use desired version of Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'

      - name: Npm install and build
        run: |
          npm ci
          npm run build

      - name: Install Playwright dependencies
        run: npx playwright install ${{ matrix.browsers }} --with-deps

      - name: Install WordPress
        run: |
          WP_ENV_CORE=WordPress/${{ matrix.wp }} WP_ENV_PHP_VERSION=${{ matrix.php }} npm run wp-env-test start
          npm run wp-env-test run cli wp core version
          npm run wp-env-test run cli wp cli info

      - name: Running e2e tests
        run: npm run test:e2e -- $(printf -- '--project=%s ' ${{ matrix.browsers }})
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Archive debug artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failures-artifacts-${{ matrix.php }}-${{ matrix.wp }}
          path: artifacts
          if-no-files-found: ignore
